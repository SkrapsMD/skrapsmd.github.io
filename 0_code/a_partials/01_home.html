<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Office</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/office.css">
</head>

<body>
  <div class="page">

    <header class="header">
      <div class="header-top">
        <h1 class="site-title">Your Company</h1>
        <div class="swatches"></div>
      </div>

      <nav class="nav">
        <button class="nav-btn active">Office</button>
        <button class="nav-btn">Products</button>
        <button class="nav-btn">Catalog</button>
        <button class="nav-btn">Extras</button>
        <button class="nav-btn">Login</button>
      </nav>
    </header>

    <main class="content">

      <section class="grid-two">
        <article class="panel">
          <h2 class="panel-title">Office</h2>
          <p class="lede"></p>
          <div class="rule"></div>
          <p class="definition"></p>
          <button class="btn">Inquiry →</button>
        </article>

        <aside class="panel">
          <h2 class="panel-title">Design philosophy</h2>
          <ul class="list"></ul>
        </aside>
      </section>

      <section class="grid-two banner">
        <div class="panel">
          <h2 class="panel-title">Frontpage Banner</h2>
          <p></p>
          <button class="btn">Learn more →</button>
        </div>

        <div class="panel image-panel">
          <!-- svg or image -->
        </div>
      </section>

    </main>

  </div>
</body>
</html>
