<!-- Template for research publication cards -->
<div class="card">
    <div class="card-title" data-field="title"></div>
    <div class="card-meta">
        <span class="mono" data-field="authors"></span> ·
        <span data-field="venue"></span> ·
        <span data-field="date"></span>
    </div>
    <div class="card-body">
        <blockquote class="card-abstract">
            <strong>Abstract:</strong> <i data-field="abstract"></i>
        </blockquote>
    </div>
    <div class="card-footer" data-field="footer-container">
        <div class="card-footer__left">
            <div class="card-badges" data-field="badges"></div>
            <div class="card-actions" data-field="buttons"></div>
        </div>
        <div class="card-press-links" data-field="press-links"></div>
    </div>
</div>
