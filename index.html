/* 00_tokens.css - Design System Tokens */
:root {
    color-scheme: light dark;
    --font-sans: "IBM Plex Sans", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --font-xs: 12px;
    --font-sm: 14px;
    --font-base: 16px;
    --font-md: 18px;
    --font-lg: 24px;
    --font-xl: 30px;
    --font-2xl: 36px;
    --font-3xl: 48px;
    --font-4xl: 72px;
    --black: #000000;
    --white: #ffffff;
    --bg: light-dark(var(--white), var(--charcoal));
    --bg-muted: light-dark(var(--marbleColumn), var(--darkGray));
    --ink: light-dark(var(--black), var(--white));
    --ink-muted: light-dark(var(--darkGray), var(--medGray));
    --ink-inv: light-dark(var(--white), var(--black));
    --ink-muted-inv: light-dark(var(--medGray), var(--darkGray));
    --text-primary: var(--ink);
    --text-secondary: var(--ink-muted);
    --text-emph: light-dark(var(--atlBlue900), var(--atlBlue300));
    --text-emph-hover: light-dark(var(--atlBlue600), var(--atlBlue600));
    --text-emph-2: light-dark(var(--atlOrange900), var(--atlOrange300));
    --text-emph-2-hover: light-dark(var(--atlOrange700), var(--atlOrange400));
    --text-strong: var(--text-emph);
    --text-italic: var(--text-secondary);
    --text-link: var(--text-emph);
    --text-link-hover: var(--text-emph-hover);
    --code-bg: var(--bg-muted);
    --code-text: var(--text-primary);
    --code-block-bg: var(--bg-muted);
    --blockquote-border: var(--text-emph);
    --blockquote-text: var(--text-secondary);
    --text-highlight: light-dark(var(--atlGold100), var(--atlGold800));
    --text-highlight-2: light-dark(var(--atlBlue100), var(--atlBlue600));
    --text-highlight-3: light-dark(var(--atlGreen100), var(--atlGreen800));
    --text-highlight-warning: light-dark(var(--atlPrimaryWarning), var(--atlSecondaryWarning));
    --active-indicator: light-dark(var(--atlDanger), var(--atlDanger));
    --frame-width: 980px;
    --pad: 14px;
    --pad-sm: 8px;
    --pad-lg: 24px;
    --border: 1px solid var(--ink);
    --border-muted: 1px solid var(--ink-muted);
    --border-radius: 0;
}

/* 01_base.css - Base Styles */
*, *::before, *::after {
    box-sizing: border-box;
}
* {
    margin: 0;
    padding: 0;
}
html {
    font-size: var(--font-sm);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}
body {
    font-family: var(--font-sans);
    font-size: var(--font-sm);
    line-height: 1.35;
    color: var(--ink);
    background: var(--bg);
}
h1, h2, h3, h4, h5, h6 {
    font-weight: 600;
    line-height: 1.2;
}
p {
    margin-bottom: 1em;
}
a {
    color: var(--text-link);
    text-decoration: none;
}
a:hover {
    color: var(--text-link-hover);
}
.ink-link{
    color:var(--ink);
}
.ink-link:hover{
    color: var(--text-link-hover);
}
.emph-link {
    color: var(--text-emph);
}
strong, b {
    color: var(--text-strong);
    font-weight: 600;
}
em, i {
    color: var(--text-italic);
    font-style: italic;
}
code, pre, kbd, samp {
    font-family: var(--font-mono);
}
.mono {
    font-family: var(--font-mono);
}
.muted {
    color: var(--text-secondary);
}
.small {
    font-size: var(--font-xs);
}
.medsmall {
    font-size: var(--font-sm);
}
.medium{
    font-size:var(--font-md);
}
.visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
}

/* 02_shell.css - Page Shell */
.frame {
    max-width: var(--frame-width);
    margin: 32px auto;
    border: var(--border);
    padding: 0;
    background: var(--bg);
}
.masthead {
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: var(--pad);
    padding-bottom: 0;
    z-index: 100;
}
.masthead-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
}
.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: inherit;
}
.brand-title {
    font-weight: 600;
    font-size: var(--font-lg);
}
#brand-icon {
    height: 4em;
    width: auto;
    display: block;
}
.swatches {
    display: grid;
    grid-auto-flow: column;
    gap: 2px;
    align-items: center;
}
.swatch {
    width: 16px;
    height: 8px;
    border: 1px solid rgba(0, 0, 0, 0.25);
}
.s1  { background: var(--atlRed600, #ce5158); }
.s2  { background: var(--atlGold200, #f3bb00); }
.s3  { background: var(--atlTeal400, #25acca); }
.s4  { background: var(--atlBlue600, #3581b4); }
.s5  { background: var(--atlIndigo600, #7d70c1); }
.s6  { background: var(--charcoal, #1a1a1a); }
.s7  { background: var(--medGray, #d0d0d0); }
.s8  { background: var(--white, #ffffff); }
.s9  { background: var(--atlFuchsia700, #c5266a); }
.s10 { background: var(--atlTeal800, #006278); }
.s11 { background: var(--atlBlue300, #88b7d4); }
.s12 { background: var(--atlGold50, #ffe89a); }
.hamburger {
    display: none;
    flex-direction: column;
    gap: 4px;
    background: transparent;
    border: none;
    padding: 8px;
    cursor: pointer;
    z-index: 101;
}
.hamburger-line {
    display: block;
    width: 24px;
    height: 2px;
    background: var(--ink);
    transition: transform 0.2s ease, opacity 0.2s ease;
}
.navbars {
    display: flex;
    gap: var(--pad-sm);
    flex-wrap: wrap;
    margin-bottom: 10px;
}
.navbtn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: var(--border);
    padding: 4px 10px;
    text-decoration: none;
    color: var(--ink);
    font-size: var(--font-xs);
    line-height: 1;
    background: transparent;
    transition: background-color 0.15s ease, color 0.15s ease;
}
.navbtn:hover {
    background: var(--ink);
    color: var(--ink-inv);
    text-decoration: none;
}
.navbtn:hover .dot{
    border: 1px solid var(--ink-inv);
}
.navbtn .dot {
    width: 8px;
    height: 8px;
    border: 1px solid var(--ink);
    border-radius: 999px;
    background: transparent;
}
.navbtn.active .dot {
    background: var(--active-indicator);
}
.section-head {
    margin-top: 6px;
    margin-bottom: 8px;
}
.section-title {
    font-weight: 600;
    font-size: var(--font-xs);
}
.rule {
    border: 0;
    border-top: var(--border-muted);
    height: 0;
    margin: 10px 0;
}
.rule.dotted {
    border-top-style: dotted;
}
.rule.solid {
    border-top: var(--border);
}
.rule.flush {
    margin-bottom: 0;
    padding-bottom:0;
}
.content {
    padding: var(--pad);
    padding-top: 4px;
    padding-bottom: 12px;
    min-height: 200px;
}
.foot {
    padding: 0 var(--pad) var(--pad);
    margin-top: var(--pad);
}
.foot-meta {
    display: flex;
    gap: var(--pad-sm);
    color: var(--text-secondary);
    font-size: var(--font-xs);
}
@media (max-width: 768px) {
    .frame {
        margin: 12px;
    }
    .masthead {
        position: relative;
    }
    .masthead,
    .content,
    .foot {
        padding-left: var(--pad-sm);
        padding-right: var(--pad-sm);
    }
    .hamburger {
        display: flex;
    }
    .navbars {
        display: none;
        flex-direction: column;
        align-items: stretch;
    }
    .navbars.open {
        display: flex;
    }
    .navbtn {
        justify-content: flex-start;
    }
}
@media (max-width: 480px) {
    .frame {
        margin: 8px;
    }
    .brand-title {
        font-size: var(--font-base);
    }
}
        </style>
