        <style>
/* ── 00_tokens ───────────────────────────────────────── */
:root {
    color-scheme: light dark;
    --font-sans: "IBM Plex Sans", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --font-xs: 12px;
    --font-sm: 14px;
    --font-base: 16px;
    --font-md: 18px;
    --font-lg: 24px;
    --font-xl: 30px;
    --font-2xl: 36px;
    --font-3xl: 48px;
    --font-4xl: 72px;
    --black: #000000;
    --white: #ffffff;
    --cream: #f7f6f3;
    --cream-dark: #edecea;
    --near-black: #141311;
    --gray-900: #2e2c29;
    --gray-700: #524f4b;
    --gray-500: #797571;
    --gray-300: #b8b4ae;
    --gray-200: #d2cfc9;
    --gray-100: #e6e3de;
    --gray-50: #f0ede9;
    --terra: #b85c38;
    --terra-dark: #96462a;
    --terra-light: #fdf1ec;
    --terra-mid: #d97b55;
    --dark-bg: #1d1b19;
    --dark-surface: #252320;
    --dark-border: #3c3a37;
    --dark-border-muted: #2f2d2a;
    --dark-ink: #f0ece7;
    --dark-ink-muted: #b8b3ac;
    --bg: light-dark(var(--cream), var(--dark-bg));
    --bg-muted: light-dark(var(--gray-50), var(--dark-surface));
    --bg-surface: light-dark(var(--white), #211f1c);
    --ink: light-dark(var(--near-black), var(--dark-ink));
    --ink-muted: light-dark(var(--gray-500), var(--dark-ink-muted));
    --ink-inv: light-dark(var(--white), var(--near-black));
    --ink-muted-inv: light-dark(var(--gray-300), var(--gray-700));
    --text-primary: var(--ink);
    --text-secondary: var(--ink-muted);
    --text-emph: light-dark(var(--terra), var(--terra-mid));
    --text-emph-hover: light-dark(var(--terra-dark), #f0a878);
    --text-emph-2: light-dark(#7a3607, #f39d61);
    --text-emph-2-hover: light-dark(#ae4d0a, #f08033);
    --text-strong: var(--text-emph);
    --text-italic: var(--text-secondary);
    --text-link: var(--text-emph);
    --text-link-hover: var(--text-emph-hover);
    --code-bg: var(--bg-muted);
    --code-text: var(--text-primary);
    --code-block-bg: var(--bg-muted);
    --blockquote-border: var(--text-emph);
    --blockquote-text: var(--text-secondary);
    --text-highlight: light-dark(#fef9e7, #4a3c00);
    --text-highlight-2: light-dark(#eaf3fb, #0e2840);
    --text-highlight-3: light-dark(#e3f5ee, #09301e);
    --text-highlight-warning: light-dark(#fff3e0, #7a3600);
    --active-indicator: var(--terra);
    --frame-width: 980px;
    --pad: 16px;
    --pad-sm: 10px;
    --pad-lg: 28px;
    --border: 1px solid light-dark(var(--gray-200), var(--dark-border));
    --border-muted: 1px solid light-dark(var(--gray-100), var(--dark-border-muted));
    --border-accent: 2px solid var(--text-emph);
    --border-radius: 0;
}

/* ── 01_base ───────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }
html {
    font-size: var(--font-base);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}
body {
    font-family: var(--font-sans);
    font-size: var(--font-base);
    line-height: 1.6;
    color: var(--ink);
    background: light-dark(var(--cream-dark), #141210);
}
h1, h2, h3, h4, h5, h6 { font-weight: 600; line-height: 1.2; }
p { margin-bottom: 1em; }
a { color: var(--text-link); text-decoration: none; }
a:hover { color: var(--text-link-hover); }
.ink-link { color: var(--ink); }
.ink-link:hover { color: var(--text-link-hover); }
.emph-link { color: var(--text-emph); }
strong, b { color: var(--text-strong); font-weight: 600; }
em, i { color: var(--text-italic); font-style: italic; }
code, pre, kbd, samp { font-family: var(--font-mono); }
.mono { font-family: var(--font-mono); }
.muted { color: var(--text-secondary); }
.small { font-size: var(--font-xs); }
.medsmall { font-size: var(--font-sm); }
.medium { font-size: var(--font-md); }
.visually-hidden {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* ── 02_shell ──────────────────────────────────────────── */

/* Thin accent stripe at top of frame */
.frame::before {
    content: '';
    display: block;
    height: 3px;
    background: linear-gradient(90deg, var(--terra) 0%, var(--terra-mid) 100%);
}

.frame {
    max-width: var(--frame-width);
    margin: 28px auto;
    background: var(--bg);
    min-width: 0;
    box-shadow: 0 1px 8px light-dark(rgba(0,0,0,0.07), rgba(0,0,0,0.35));
}

@media (max-width: 1040px) {
    .frame { margin: 20px; }
}

/* Masthead */
.masthead {
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
    border-bottom: var(--border-muted);
}

.masthead-inner {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px var(--pad-lg);
}

/* Brand */
.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: inherit;
    flex-shrink: 0;
    margin-right: auto;
}

.brand:hover { text-decoration: none; }

.brand-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.brand-name {
    font-weight: 600;
    font-size: var(--font-md);
    line-height: 1.1;
    color: var(--ink);
    transition: color 0.15s ease;
}

.brand:hover .brand-name { color: var(--text-emph); }

.brand-role {
    font-size: var(--font-xs);
    font-family: var(--font-mono);
    color: var(--text-secondary);
    line-height: 1;
    letter-spacing: 0.01em;
}

#brand-icon {
    height: 3em;
    width: auto;
    display: block;
}

/* Hamburger (mobile only) */
.hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: transparent;
    border: none;
    padding: 8px;
    cursor: pointer;
    z-index: 101;
    flex-shrink: 0;
}
.hamburger-line {
    display: block;
    width: 22px;
    height: 2px;
    background: var(--ink);
    transition: transform 0.2s ease, opacity 0.2s ease;
}

/* Navigation */
.navbars {
    display: flex;
    align-items: center;
    gap: 2px;
    flex-wrap: nowrap;
}

.navbtn {
    display: inline-flex;
    align-items: center;
    padding: 6px 10px;
    text-decoration: none;
    color: var(--text-secondary);
    font-size: var(--font-sm);
    font-family: var(--font-mono);
    line-height: 1;
    background: transparent;
    border: none;
    border-radius: 3px;
    transition: color 0.15s ease, background-color 0.15s ease;
    white-space: nowrap;
}

.navbtn:hover {
    color: var(--text-emph);
    background: var(--terra-light);
    text-decoration: none;
}

.navbtn.active {
    color: var(--text-emph);
    font-weight: 600;
}

/* Section helpers */
.section-head {
    margin-top: 6px;
    margin-bottom: 8px;
}
.section-title {
    font-weight: 600;
    font-size: var(--font-xs);
}

/* Rules */
.rule {
    border: 0;
    border-top: var(--border-muted);
    height: 0;
    margin: 12px 0;
}
.rule.dotted { border-top-style: dotted; }
.rule.solid { border-top: var(--border); }
.rule.flush { margin-bottom: 0; padding-bottom: 0; }

/* Content area */
.content {
    padding: var(--pad-lg);
    padding-top: var(--pad);
    padding-bottom: var(--pad);
    min-height: 280px;
}

/* Footer */
.foot {
    padding: var(--pad-sm) var(--pad-lg) var(--pad-lg);
    border-top: var(--border-muted);
    margin-top: var(--pad);
}
.foot-meta {
    display: flex;
    gap: var(--pad-sm);
    color: var(--text-secondary);
    font-size: var(--font-xs);
    font-family: var(--font-mono);
}

/* ── Mobile ──────────────────────────────────────────────── */
@media (max-width: 768px) {
    .frame { margin: 12px; }
    .masthead { position: relative; }
    .masthead-inner { flex-wrap: wrap; padding: 10px var(--pad); gap: 8px; }
    .hamburger { display: flex; }
    .navbars {
        display: none;
        width: 100%;
        flex-direction: column;
        align-items: stretch;
        border-top: var(--border-muted);
        padding-top: 8px;
        margin-top: 4px;
    }
    .navbars.open { display: flex; }
    .navbtn { justify-content: flex-start; width: 100%; border-radius: 0; }
    .content { padding: var(--pad); padding-top: var(--pad-sm); }
    .foot { padding: var(--pad-sm) var(--pad) var(--pad); }
}

@media (max-width: 480px) {
    .frame { margin: 8px; }
    .brand-name { font-size: var(--font-base); }
    .brand-role { display: none; }
}
        </style>
