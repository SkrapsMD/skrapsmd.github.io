/* ── 00_tokens  ·  Atelier Économique  ──────────────────── */
/* Art Deco precision × Mid-Century Modern warmth           */
:root {
    color-scheme: light dark;
    --font-sans: "IBM Plex Sans", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --font-xs: 12px;
    --font-sm: 14px;
    --font-base: 16px;
    --font-md: 18px;
    --font-lg: 24px;
    --font-xl: 30px;
    --font-2xl: 36px;
    --font-3xl: 48px;
    --font-4xl: 72px;

    /* Primitives ── keep legacy names for FRBA_scheme compat */
    --black: #000000;
    --white: #ffffff;

    /* Warm ivory — aged paper tones */
    --ivory:       #f2eed8;
    --ivory-mid:   #e6e1c8;
    --ivory-deep:  #d9d3b8;

    /* Deep Art Deco navy */
    --navy:        #0e1b2d;
    --navy-mid:    #1e3350;
    --navy-light:  #2e4d72;

    /* Burnished gold — the single accent */
    --gold:        #c8902a;
    --gold-dark:   #a87020;
    --gold-light:  #f5e6be;
    --gold-pale:   #fdf8ef;

    /* MCM teal — contrasting secondary */
    --teal:        #2e7d7d;
    --teal-dark:   #1f5a5a;
    --teal-light:  #d4eeee;

    /* Warm gray scale */
    --warm-black:  #1a1612;
    --warm-900:    #2c2520;
    --warm-700:    #7a6e5e;
    --warm-500:    #a09480;
    --warm-300:    #c8bfaf;
    --warm-200:    #ddd8cc;
    --warm-100:    #ece8df;
    --warm-50:     #f5f2ea;

    /* Dark mode surfaces */
    --dark-bg:           #07101c;
    --dark-surface:      #0e1b2d;
    --dark-border:       #1e3350;
    --dark-border-muted: #142035;
    --dark-ink:          #f2eedd;
    --dark-ink-muted:    #9a8e7a;

    /* Semantic tokens */
    --bg:          light-dark(var(--ivory),      var(--dark-bg));
    --bg-muted:    light-dark(var(--ivory-mid),  var(--dark-surface));
    --bg-surface:  light-dark(var(--gold-pale),  #0a1420);
    --ink:         light-dark(var(--warm-black), var(--dark-ink));
    --ink-muted:   light-dark(var(--warm-700),   var(--dark-ink-muted));
    --ink-inv:     light-dark(var(--white),      var(--warm-black));
    --ink-muted-inv: light-dark(var(--warm-300), var(--warm-900));
    --text-primary:    var(--ink);
    --text-secondary:  var(--ink-muted);
    --text-emph:       light-dark(var(--gold),      var(--gold));
    --text-emph-hover: light-dark(var(--gold-dark),  #e8b050);
    --text-emph-2:     light-dark(var(--teal),       #6ec8c8);
    --text-emph-2-hover: light-dark(var(--teal-dark), #a0d8d8);
    --text-strong:     var(--text-emph);
    --text-italic:     var(--text-secondary);
    --text-link:       var(--text-emph);
    --text-link-hover: var(--text-emph-hover);
    --code-bg:         var(--bg-muted);
    --code-text:       var(--text-primary);
    --code-block-bg:   var(--bg-muted);
    --blockquote-border: var(--teal);
    --blockquote-text:   var(--text-secondary);
    --text-highlight:         light-dark(var(--gold-light),  #4a3800);
    --text-highlight-2:       light-dark(var(--teal-light),  #0e2840);
    --text-highlight-3:       light-dark(#d8f0e8,            #09301e);
    --text-highlight-warning: light-dark(#fff3e0,            #7a3600);
    --active-indicator: var(--gold);
    --frame-width: 980px;
    --pad:    16px;
    --pad-sm: 10px;
    --pad-lg: 28px;
    --border:        1px solid light-dark(var(--warm-200), var(--dark-border));
    --border-muted:  1px solid light-dark(var(--warm-100), var(--dark-border-muted));
    --border-accent: 2px solid var(--text-emph);
    --border-radius: 0;

    /* Legacy terra aliases (keeps any remaining refs working) */
    --terra:       var(--gold);
    --terra-dark:  var(--gold-dark);
    --terra-light: var(--gold-light);
    --terra-mid:   #d4aa60;
}

/* ── 01_base ───────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }
html {
    font-size: var(--font-base);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}
body {
    font-family: var(--font-sans);
    font-size: var(--font-base);
    line-height: 1.6;
    color: var(--ink);
    background: light-dark(var(--ivory-deep), #040c16);
}
h1, h2, h3, h4, h5, h6 { font-weight: 600; line-height: 1.2; }
p { margin-bottom: 1em; }
a { color: var(--text-link); text-decoration: none; }
a:hover { color: var(--text-link-hover); }
.ink-link { color: var(--ink); }
.ink-link:hover { color: var(--text-link-hover); }
.emph-link { color: var(--text-emph); }
strong, b { color: var(--text-strong); font-weight: 600; }
em, i { color: var(--text-italic); font-style: italic; }
code, pre, kbd, samp { font-family: var(--font-mono); }
.mono { font-family: var(--font-mono); }
.muted { color: var(--text-secondary); }
.small { font-size: var(--font-xs); }
.medsmall { font-size: var(--font-sm); }
.medium { font-size: var(--font-md); }
.visually-hidden {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* ── 02_shell  ·  Atelier Économique ──────────────────── */

.frame {
    max-width: var(--frame-width);
    margin: 28px auto;
    background: var(--bg);
    min-width: 0;
    border: 1px solid light-dark(var(--warm-200), var(--dark-border));
    box-shadow: 0 4px 40px light-dark(rgba(14,27,45,0.13), rgba(0,0,0,0.5));
}

@media (max-width: 1040px) {
    .frame { margin: 20px; }
}

/* Masthead — deep Art Deco navy bar */
.masthead {
    position: sticky;
    top: 0;
    background: var(--navy);
    z-index: 100;
    border-bottom: none;
}

/* Burnished gold rule below masthead */
.masthead::after {
    content: '';
    display: block;
    height: 3px;
    background: linear-gradient(
        90deg,
        var(--gold-dark)  0%,
        var(--gold)       30%,
        #e8c060          55%,
        var(--gold)       75%,
        var(--gold-dark) 100%
    );
}

.masthead-inner {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px var(--pad-lg);
}

/* Brand */
.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: inherit;
    flex-shrink: 0;
    margin-right: auto;
}

.brand:hover { text-decoration: none; }

.brand-text {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.brand-name {
    font-weight: 600;
    font-size: var(--font-md);
    line-height: 1.1;
    color: #f5f0e8;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: color 0.2s ease;
}

.brand:hover .brand-name { color: var(--gold); }

.brand-role {
    font-size: var(--font-xs);
    font-family: var(--font-mono);
    color: rgba(245, 240, 232, 0.45);
    line-height: 1;
    letter-spacing: 0.05em;
}

#brand-icon {
    height: 3em;
    width: auto;
    display: block;
    filter: invert(1) sepia(0.15) brightness(0.92);
    opacity: 0.88;
}

/* Hamburger (mobile only) — warm white lines for dark header */
.hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: transparent;
    border: none;
    padding: 8px;
    cursor: pointer;
    z-index: 101;
    flex-shrink: 0;
}
.hamburger-line {
    display: block;
    width: 22px;
    height: 2px;
    background: rgba(245, 240, 232, 0.8);
    transition: transform 0.2s ease, opacity 0.2s ease;
}

/* Navigation — uppercase tracked on dark */
.navbars {
    display: flex;
    align-items: center;
    gap: 0;
    flex-wrap: nowrap;
}

.navbtn {
    display: inline-flex;
    align-items: center;
    padding: 10px 11px;
    text-decoration: none;
    color: rgba(245, 240, 232, 0.5);
    font-size: var(--font-xs);
    font-family: var(--font-mono);
    line-height: 1;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: transparent;
    border: none;
    border-radius: 0;
    transition: color 0.15s ease, background-color 0.15s ease;
    white-space: nowrap;
    position: relative;
}

/* Animated underline indicator */
.navbtn::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 2px;
    background: var(--gold);
    transition: width 0.2s ease;
}

.navbtn:hover {
    color: rgba(245, 240, 232, 0.95);
    background: rgba(200, 144, 42, 0.1);
    text-decoration: none;
}

.navbtn:hover::after {
    width: 65%;
}

.navbtn.active {
    color: var(--gold);
    font-weight: 600;
}

.navbtn.active::after {
    width: 65%;
}

/* Section helpers */
.section-head {
    margin-top: 6px;
    margin-bottom: 8px;
}
.section-title {
    font-weight: 600;
    font-size: var(--font-xs);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--warm-500);
}

/* Rules */
.rule {
    border: 0;
    border-top: var(--border-muted);
    height: 0;
    margin: 12px 0;
}
.rule.dotted { border-top-style: dotted; }
.rule.solid { border-top: var(--border); }
.rule.flush { margin-bottom: 0; padding-bottom: 0; }

/* Art Deco double rule */
.deco-rule {
    border: none;
    height: 5px;
    border-top: 1px solid light-dark(var(--warm-200), var(--dark-border));
    border-bottom: 1px solid light-dark(var(--warm-100), var(--dark-border-muted));
    margin: 24px 0;
    background: transparent;
}

/* Content area */
.content {
    padding: var(--pad-lg);
    padding-top: var(--pad);
    padding-bottom: var(--pad);
    min-height: 280px;
}

/* Footer */
.foot {
    padding: var(--pad-sm) var(--pad-lg) var(--pad-lg);
    border-top: 1px solid light-dark(var(--warm-200), var(--dark-border));
    margin-top: var(--pad);
}
.foot-meta {
    display: flex;
    gap: var(--pad-sm);
    color: var(--warm-500);
    font-size: var(--font-xs);
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.07em;
}

/* ── Mobile ──────────────────────────────────────────────── */
@media (max-width: 768px) {
    .frame { margin: 12px; }
    .masthead { position: relative; }
    .masthead-inner { flex-wrap: wrap; padding: 10px var(--pad); gap: 8px; }
    .hamburger { display: flex; }
    .navbars {
        display: none;
        width: 100%;
        flex-direction: column;
        align-items: stretch;
        border-top: 1px solid rgba(245,240,232,0.1);
        padding-top: 8px;
        margin-top: 4px;
    }
    .navbars.open { display: flex; }
    .navbtn { justify-content: flex-start; width: 100%; }
    .navbtn::after { display: none; }
    .content { padding: var(--pad); padding-top: var(--pad-sm); }
    .foot { padding: var(--pad-sm) var(--pad) var(--pad); }
}

@media (max-width: 480px) {
    .frame { margin: 8px; }
    .brand-name { font-size: var(--font-base); }
    .brand-role { display: none; }
}
        </style>
