        <style>
/* ── 00_tokens  ·  Government Blue palette ──────────────── */
:root {
    color-scheme: light dark;
    --font-sans: "IBM Plex Sans", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --font-xs: 12px;
    --font-sm: 14px;
    --font-base: 16px;
    --font-md: 18px;
    --font-lg: 24px;
    --font-xl: 30px;
    --font-2xl: 36px;
    --font-3xl: 48px;
    --font-4xl: 72px;

    --black: #000000;
    --white: #ffffff;

    /* Paper cream — the document's printed page */
    --ivory:       #f2f0e8;
    --ivory-mid:   #e6e4dc;
    --ivory-deep:  #d8d6ce;

    /* Deep ink navy — masthead and structural elements */
    --navy:        #0e1b2d;
    --navy-mid:    #1e3350;
    --navy-light:  #2e4d72;

    /* Government blue — US Dept. of Commerce 1954 palette */
    /* Replaces warm gold as the accent; excellent contrast on cream */
    --gov-blue:       #2d5580;   /* main accent — ~7:1 on ivory */
    --gov-blue-dark:  #1e3d5c;   /* hover / darker state */
    --gov-blue-mid:   #3d6b96;   /* mid tone for UI elements */
    --gov-blue-light: #c4d9ec;   /* tint for backgrounds / highlights */
    --gov-blue-pale:  #edf3f8;   /* very pale surface */

    /* Warm teal — secondary accent (kept for contrast variety) */
    --ws-teal:     #2e7d7d;
    --teal-dark:   #1f5a5a;
    --teal-light:  #d4eeee;

    /* Legacy gold — retained for dark-mode only contexts */
    --ws-gold:     #c8902a;
    --gold-dark:   #a87020;
    --gold-light:  #f5e6be;
    --gold-pale:   #fdf8ef;

    /* Warm gray scale */
    --warm-black:  #1a1612;
    --warm-900:    #2c2520;
    --warm-700:    #7a6e5e;
    --warm-500:    #a09480;
    --warm-300:    #c8bfaf;
    --warm-200:    #ddd8cc;
    --warm-100:    #ece8df;
    --warm-50:     #f5f2ea;

    /* Dark mode surfaces */
    --dark-bg:           #07101c;
    --dark-surface:      #0e1b2d;
    --dark-border:       #1e3350;
    --dark-border-muted: #142035;
    --dark-ink:          #f2eedd;
    --dark-ink-muted:    #9a8e7a;

    /* ── Semantic tokens ── */
    --bg:          light-dark(var(--ivory),      var(--dark-bg));
    --bg-muted:    light-dark(var(--ivory-mid),  var(--dark-surface));
    --bg-surface:  light-dark(var(--gov-blue-pale), #0a1420);
    --ink:         light-dark(var(--warm-black), var(--dark-ink));
    --ink-muted:   light-dark(var(--warm-700),   var(--dark-ink-muted));
    --ink-inv:     light-dark(var(--white),      var(--warm-black));
    --ink-muted-inv: light-dark(var(--warm-300), var(--warm-900));

    --text-primary:    var(--ink);
    --text-secondary:  var(--ink-muted);

    /* Government blue as content accent — high contrast on cream */
    --text-emph:       light-dark(var(--gov-blue),      #7aacce);
    --text-emph-hover: light-dark(var(--gov-blue-dark), #9ac8e8);
    --text-emph-2:     light-dark(var(--ws-teal),       #6ec8c8);
    --text-emph-2-hover: light-dark(var(--teal-dark),   #a0d8d8);
    --text-strong:     var(--text-primary);
    --text-italic:     var(--text-secondary);
    --text-link:       var(--text-emph);
    --text-link-hover: var(--text-emph-hover);

    --code-bg:         var(--bg-muted);
    --code-text:       var(--text-primary);
    --code-block-bg:   var(--bg-muted);
    --blockquote-border: var(--gov-blue);
    --blockquote-text:   var(--text-secondary);

    --text-highlight:         light-dark(var(--gov-blue-light), #1e3040);
    --text-highlight-2:       light-dark(var(--teal-light),     #0e2840);
    --text-highlight-3:       light-dark(#d8f0e8,               #09301e);
    --text-highlight-warning: light-dark(#fff3e0,               #7a3600);

    --active-indicator: var(--gov-blue);
    --frame-width: 980px;
    --pad:    16px;
    --pad-sm: 10px;
    --pad-lg: 28px;
    --border:        1px solid light-dark(var(--warm-200), var(--dark-border));
    --border-muted:  1px solid light-dark(var(--warm-100), var(--dark-border-muted));
    --border-accent: 2px solid var(--text-emph);
    --border-radius: 0;

    /* Legacy terra aliases */
    --terra:       var(--gov-blue);
    --terra-dark:  var(--gov-blue-dark);
    --terra-light: var(--gov-blue-light);
    --terra-mid:   var(--gov-blue-mid);
}

/* ── 01_base ───────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }
html {
    font-size: var(--font-base);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}
body {
    font-family: var(--font-sans);
    font-size: var(--font-base);
    line-height: 1.6;
    color: var(--ink);
    background: light-dark(var(--ivory-deep), #040c16);
}
h1, h2, h3, h4, h5, h6 { font-weight: 600; line-height: 1.2; }
p { margin-bottom: 1em; }
a { color: var(--text-link); text-decoration: none; }
a:hover { color: var(--text-link-hover); }
.ink-link { color: var(--ink); }
.ink-link:hover { color: var(--text-link-hover); }
.emph-link { color: var(--text-emph); }
strong, b { font-weight: 600; }
em, i { color: var(--text-italic); font-style: italic; }
code, pre, kbd, samp { font-family: var(--font-mono); }
.mono { font-family: var(--font-mono); }
.muted { color: var(--text-secondary); }
.small { font-size: var(--font-xs); }
.medsmall { font-size: var(--font-sm); }
.medium { font-size: var(--font-md); }
.visually-hidden {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* ── 02_shell  ·  Deco Press — Government Blue edition ─── */

.frame {
    max-width: var(--frame-width);
    margin: 28px auto;
    background: var(--bg);
    min-width: 0;
    border: 1px solid light-dark(var(--warm-200), var(--dark-border));
    box-shadow: 0 4px 40px light-dark(rgba(14,27,45,0.10), rgba(0,0,0,0.5));
}

@media (max-width: 1040px) { .frame { margin: 20px; } }

/* Masthead — centered, monumental, two rows */
.masthead {
    position: sticky;
    top: 0;
    background: var(--navy);
    z-index: 100;
    text-align: center;
    /* Clean solid rule — no gradient ornament */
    border-bottom: 1px solid rgba(255, 255, 255, 0.10);
}

/* Brand block: centered column — name → role (no icon) */
.masthead-brand-block {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 60px 14px;
    position: relative;
}

.brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    text-decoration: none;
    color: inherit;
}
.brand:hover { text-decoration: none; }

.brand-name {
    font-weight: 300;
    font-size: var(--font-2xl);
    line-height: 1;
    color: #f2f0e8;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    transition: color 0.2s ease;
}
.brand:hover .brand-name { color: #ffffff; }

.brand-role {
    font-size: 10px;
    font-family: var(--font-mono);
    color: rgba(242, 240, 232, 0.38);
    line-height: 1;
    letter-spacing: 0.14em;
    text-transform: uppercase;
}

/* Theme toggle — absolutely positioned right */
.theme-toggle {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 0;
    cursor: pointer;
    color: rgba(242, 240, 232, 0.42);
    font-size: 13px;
    line-height: 1;
    transition: color 0.15s ease, border-color 0.15s ease;
    padding: 0;
    flex-shrink: 0;
}
.theme-toggle:hover {
    color: #f2f0e8;
    border-color: rgba(255, 255, 255, 0.55);
}

/* Hamburger — hidden by default, absolute left */
.hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: transparent;
    border: none;
    padding: 8px;
    cursor: pointer;
    z-index: 101;
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
}
.hamburger-line {
    display: block;
    width: 20px;
    height: 2px;
    background: rgba(242, 240, 232, 0.72);
    transition: transform 0.2s ease, opacity 0.2s ease;
}

/* Navigation row: centered, thin top rule */
.navbars {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    flex-wrap: nowrap;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
}

.navbtn {
    display: inline-flex;
    align-items: center;
    padding: 8px 13px;
    text-decoration: none;
    color: rgba(242, 240, 232, 0.40);
    font-size: 10px;
    font-family: var(--font-mono);
    line-height: 1;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    background: transparent;
    border: none;
    border-radius: 0;
    transition: color 0.15s ease, background-color 0.15s ease;
    white-space: nowrap;
    position: relative;
}
.navbtn::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 2px;
    background: rgba(255, 255, 255, 0.6);
    transition: width 0.2s ease;
}
.navbtn:hover {
    color: rgba(242, 240, 232, 0.88);
    background: rgba(255, 255, 255, 0.05);
    text-decoration: none;
}
.navbtn:hover::after { width: 55%; }
.navbtn.active { color: #f2f0e8; font-weight: 600; }
.navbtn.active::after { width: 55%; background: rgba(255,255,255,0.8); }

/* Section helpers */
.section-head { margin-top: 6px; margin-bottom: 8px; }
.section-title {
    font-weight: 600;
    font-size: var(--font-xs);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--warm-500);
}

/* Rules */
.rule { border: 0; border-top: var(--border-muted); height: 0; margin: 12px 0; }
.rule.dotted { border-top-style: dotted; }
.rule.solid { border-top: var(--border); }
.rule.flush { margin-bottom: 0; padding-bottom: 0; }

/* Content area */
.content {
    padding: var(--pad-lg);
    padding-top: var(--pad);
    padding-bottom: var(--pad);
    min-height: 280px;
    overflow: hidden;
}

/* Footer */
.foot {
    padding: var(--pad-sm) var(--pad-lg) var(--pad-lg);
    border-top: 1px solid light-dark(var(--warm-200), var(--dark-border));
    margin-top: var(--pad);
    text-align: center;
}
.foot-meta {
    display: flex;
    justify-content: center;
    gap: var(--pad-sm);
    color: var(--warm-500);
    font-size: var(--font-xs);
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.1em;
}

/* ── Mobile ──────────────────────────────────────────────── */
@media (max-width: 768px) {
    .frame { margin: 12px; }
    .masthead { position: relative; }
    .masthead-brand-block { padding: 10px 52px 10px; }
    .brand-name { font-size: var(--font-xl); letter-spacing: 0.14em; }
    .hamburger { display: flex; }
    .navbars {
        display: none;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        border-top: 1px solid rgba(255,255,255,0.06);
        padding: 4px 0;
    }
    .navbars.open { display: flex; }
    .navbtn { justify-content: center; padding: 10px; }
    .navbtn::after { display: none; }
    .content { padding: var(--pad); padding-top: var(--pad-sm); overflow: hidden; }
    .foot { padding: var(--pad-sm) var(--pad) var(--pad); }
}

@media (max-width: 480px) {
    .frame { margin: 8px; }
    .brand-name { font-size: var(--font-lg); letter-spacing: 0.1em; }
    .brand-role { display: none; }
}
        </style>

    </head>
